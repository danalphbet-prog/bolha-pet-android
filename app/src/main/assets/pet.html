const $chat=document.getElementById('messages'), $input=document.getElementById('input');
const $welcome=document.getElementById('welcome');let activeAnswer=null,working=false,backendReady=false,previewIndex=0;
function statusText(text,mode){document.getElementById('petStatus').textContent=text;document.getElementById('statusDot').className='dot '+(mode||'');}
function addMessage(role,text,pending){if($welcome)$welcome.style.display='none';const div=document.createElement('article');div.className='msg '+(role==='user'?'user':'pet')+(pending?' pending':'');const label=document.createElement('div');label.className='who';label.textContent=role==='user'?'Você':'Bolha';const body=document.createElement('div');body.className='body';body.textContent=text;div.append(label,body);$chat.append(div);$chat.scrollTop=$chat.scrollHeight;return div}
function cleanText(s){return String(s??'').replace(/\r/g,'')};
function acceptMessage(){let text=$input.value.trim();if(!text||working)return; if(window.PetNative&&!backendReady){statusText('Baixe o Qwen para começar a conversar','');showModelCard(true);return;} $input.value='';$input.style.height='auto'; working=true; document.getElementById('sendBtn').disabled=true;addMessage('user',text);activeAnswer=addMessage('pet','Pensando em você...',true);PetFace.setEmotion('pensativo');PetFace.setTalking(false);statusText('Pensando com carinho...','busy'); if(window.PetNative){window.PetNative.send(text)}else demoAnswer(text)}
document.getElementById('composer').addEventListener('submit',e=>{e.preventDefault();acceptMessage()});
$input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();acceptMessage()}});
$input.addEventListener('input',()=>{$input.style.height='auto';$input.style.height=Math.min($input.scrollHeight,115)+'px'});
function showModelCard(value){document.getElementById('modelCard').classList.toggle('visible',!!value)}
document.getElementById('downloadBtn').addEventListener('click',()=>{if(window.PetNative)window.PetNative.downloadModel();else statusText('Baixe o APK para instalar o Qwen','')});
document.getElementById('modelSelector').addEventListener('change',e=>{if(window.PetNative)window.PetNative.selectModel(e.target.value);else statusText('Modelo selecionado: '+e.target.value,'')});
document.getElementById('importBtn').addEventListener('click',()=>{if(window.PetNative)window.PetNative.importModel();else statusText('Importação disponível no aplicativo Android','')});
function handleData(packet){const p=typeof packet==='string'?JSON.parse(packet):packet;switch(p.type){
 case 'status':statusText(p.text||'',p.mode||'');break;
 case 'model':backendReady=!!p.ready;showModelCard(!backendReady);if(p.title)document.getElementById('modelTitle').textContent=p.title;if(p.selected)document.getElementById('modelSelector').value=p.selected;document.getElementById('modelSelector').disabled=!!p.downloading;if(p.info)document.getElementById('modelInfo').textContent=p.info;document.getElementById('progressWrap').style.display=p.downloading?'block':'none';if(p.progress!=null)document.getElementById('progressBar').style.width=p.progress+'%';document.getElementById('downloadBtn').disabled=!!p.downloading;document.getElementById('importBtn').disabled=!!p.downloading;break;
 case 'history':if(Array.isArray(p.messages))p.messages.forEach(m=>addMessage(m.role==='user'?'user':'pet',cleanText(m.text)));break;
 case 'emotion':PetFace.setEmotion(p.name);PetFace.setTalking(false);break;
 case 'delta':if(activeAnswer){const b=activeAnswer.querySelector('.body');if(activeAnswer.classList.contains('pending')){b.textContent='';activeAnswer.classList.remove('pending')}b.textContent+=cleanText(p.text);$chat.scrollTop=$chat.scrollHeight;PetFace.setTalking(true)}break;
 case 'done':if(activeAnswer){activeAnswer.classList.remove('pending');if(activeAnswer.querySelector('.body').textContent==='Pensando em você...')activeAnswer.querySelector('.body').textContent='Estou aqui!'}activeAnswer=null;working=false;document.getElementById('sendBtn').disabled=false;PetFace.setTalking(false);statusText('Seu pet está aqui com você','ready');break;
 case 'error':if(activeAnswer){activeAnswer.classList.add('error');activeAnswer.querySelector('.body').textContent=p.text||'Houve um erro';activeAnswer.classList.remove('pending')}activeAnswer=null;working=false;document.getElementById('sendBtn').disabled=false;PetFace.setTalking(false);PetFace.setEmotion('confuso');statusText('Algo não saiu como esperado','');break;
 }}
